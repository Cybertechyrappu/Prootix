name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  build-nightly:
    name: Build Nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install dependencies
        run: cd apps/mobile && npm ci

      - name: Build Debug APK
        run: cd apps/mobile/android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prootix-nightly
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  upload-nightly:
    name: Upload to GitHub
    needs: build-nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4

      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "Prootix Nightly" --yes || true

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Nightly Build
            
            **Build Date:** ${{ github.event.head_commit.timestamp }}
            
            Download the APK below.
          tag_name: nightly
          release_name: 'Prootix Nightly'
          prerelease: true
          files: prootix-nightly/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}