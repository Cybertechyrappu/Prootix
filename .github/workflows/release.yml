name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      abi_target:
        description: 'ABI Target'
        required: true
        default: 'universal'
        type: choice
        options:
          - universal
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

env:
  flutter_version: '3.22.0'
  java_version: '17'
  github_token: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-checks:
    name: Pre-release Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="1.0.0-${{ inputs.release_type }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Generate release notes
        id: notes
        run: |
          NOTES="## Release ${{ steps.version.outputs.version }}\n\n### Changes\n"
          git log --oneline -20 >> git_log.txt
          while IFS= read -r line; do
            NOTES+="- $line\n"
          done < git_log.txt
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

  build-release:
    name: Build Release APKs
    needs: release-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            suffix: '-arm64'
          - abi: armeabi-v7a
            suffix: '-arm'
          - abi: x86_64
            suffix: '-x86_64'
    if: "github.event.inputs.abi_target == 'all' || needs.release-checks.outputs.version != ''"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.java_version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: flutter-${{ runner.os }}-${{ env.flutter_version }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: cd apps/flutter && flutter pub get

      - name: Build release APK (${{ matrix.abi }})
        run: |
          cd apps/flutter
          flutter build apk --release --target-platform android-${{ matrix.abi }} --split-per-abi

      - name: Generate checksums
        run: |
          cd apps/flutter/build/app/outputs/flutter-apk
          sha256sum app-release-${{ matrix.abi }}.apk > app-release-${{ matrix.abi }}.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prootix-release-${{ matrix.abi }}
          path: apps/flutter/build/app/outputs/flutter-apk/app-release-${{ matrix.abi }}.apk
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: prootix-checksums-${{ matrix.abi }}
          path: apps/flutter/build/app/outputs/flutter-apk/app-release-${{ matrix.abi }}.apk.sha256
          retention-days: 30

  build-universal-release:
    name: Build Universal Release
    needs: release-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.java_version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: flutter-${{ runner.os }}-${{ env.flutter_version }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: cd apps/flutter && flutter pub get

      - name: Build universal release APK
        run: cd apps/flutter && flutter build apk --release

      - name: Build App Bundle
        run: cd apps/flutter && flutter build appbundle --release

      - name: Generate checksums
        run: |
          cd apps/flutter/build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          cd ../app-release
          sha256sum app-release.aab > app-release.aab.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prootix-release-universal
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: prootix-release-aab
          path: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [release-checks, build-release, build-universal-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/*/; do
            cp "$dir"*.apk release-assets/ 2>/dev/null || true
            cp "$dir"*.aab release-assets/ 2>/dev/null || true
            cp "$dir"*.sha256 release-assets/ 2>/dev/null || true
          done
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-assets/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark as latest
        run: |
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            -d '{"make_latest": "true"}'