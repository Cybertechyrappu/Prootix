name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  flutter_version: '3.22.0'
  java_version: '17'

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: flutter-${{ runner.os }}-${{ env.flutter_version }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.flutter_version }}-

      - name: Install dependencies
        run: cd apps/flutter && flutter pub get

      - name: Analyze code
        run: cd apps/flutter && flutter analyze --no-fatal-infos

  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: flutter-${{ runner.os }}-${{ env.flutter_version }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: cd apps/flutter && flutter pub get

      - name: Run tests
        run: cd apps/flutter && flutter test --no-pub --reporter compact

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.java_version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: flutter-${{ runner.os }}-${{ env.flutter_version }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: cd apps/flutter && flutter pub get

      - name: Build debug APK (${{ matrix.abi }})
        run: |
          cd apps/flutter
          flutter build apk --debug --target-platform android-${{ matrix.abi }} --split-per-abi
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_NDK_HOME: /opt/android-ndk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prootix-debug-${{ matrix.abi }}
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug-${{ matrix.abi }}.apk
          retention-days: 7

  build-universal:
    name: Build Universal APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.java_version }}
          distribution: 'temurin'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: flutter-${{ runner.os }}-${{ env.flutter_version }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: cd apps/flutter && flutter pub get

      - name: Build universal debug APK
        run: cd apps/flutter && flutter build apk --debug

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: prootix-debug-universal
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7